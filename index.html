<script>
'use strict';
const KEY='math-breakthrough-numberline-basic-v1';
const titles=['先认识中点','再来折一折','动点：从位置到方程'];
const descs=['两个点的正中间，该怎样找？','折过去重合，为什么两边一样长？','用 t 表示位置，再解相遇与追及方程。'];
const stageNames=['读懂例子','动手试试','理解方法','5题检测','本关总结'];
const freshLesson=()=>({read:[false,false,false],summary:false,stage:0,demo:0,observations:[],runs:[],current:0,lab:null});
let S={version:1,page:'home',last:'l0',lessons:[freshLesson(),freshLesson(),freshLesson()],exit:null,confirmed:false};let saveFailed=false;
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&raw.version===1){S={...S,...raw};S.lessons=[0,1,2].map(i=>({...freshLesson(),...(raw.lessons?.[i]||{}),read:Array.isArray(raw.lessons?.[i]?.read)?raw.lessons[i].read.slice(0,3):[false,false,false],runs:Array.isArray(raw.lessons?.[i]?.runs)?raw.lessons[i].runs:[],observations:Array.isArray(raw.lessons?.[i]?.observations)?raw.lessons[i].observations:[]}));}}catch(e){saveFailed=true;}
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=x=>String(Math.round(x*100)/100).replace('-','−');const par=x=>x<0?'('+n(x)+')':n(x);
const frac=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){saveFailed=true;}$('#savewarn').innerHTML=saveFailed?'<div class="savewarn">此浏览器暂时无法保存学习记录。你仍可继续学习，请用“导出记录”保留本次结果。</div>':'';}
const learned=i=>S.lessons[i].guided?.read.length===GUIDE[i].steps.length&&S.lessons[i].guided.read.every(Boolean)&&S.lessons[i].summary;
const allLearned=()=>[0,1,2].every(learned);
function parseNum(v){let t=String(v??'').normalize('NFKC').trim().replace(/[−﹣–—]/g,'-').replace(/\s/g,'');if(!t)return null;if(/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(t))return Number(t);if(/^[+-]?\d+\/[+-]?\d+$/.test(t)){let [a,b]=t.split('/').map(Number);return b? a/b:NaN;}return NaN;}
function correct(q,v){const x=parseNum(v);return x!==null&&Number.isFinite(x)&&Math.abs(x-q.answer)<1e-8;}
function score(run){const a=run.snapshot||{};let good=0,blank=0;run.qs.forEach((q,j)=>{if(String(a[j]??'').trim()==='')blank++;else if(correct(q,a[j]))good++;});return{good,blank,wrong:run.qs.length-good-blank,total:run.qs.length,pct:Math.round(100*good/run.qs.length)};}
const passedExit=()=>S.exit?.snapshot&&score(S.exit).good===S.exit.qs.length;
const completed=()=>allLearned()&&passedExit()&&S.confirmed;
function Q(type,vals,input=false){let q={type,...vals,input};if(["expr","meet","chase","equation"].includes(type))return motionQuestion(q);if(type==='mid'){q.answer=(q.a+q.b)/2;q.title=`点 A 在 ${n(q.a)}，点 B 在 ${n(q.b)}。它们的中点表示什么数？`;}if(type==='distance'){q.answer=Math.abs(q.b-q.a);q.title=`点 A 在 ${n(q.a)}，点 B 在 ${n(q.b)}。两点相隔几个单位长度？`;}if(type==='fold'){q.answer=2*q.c-q.a;q.title=`沿表示 ${n(q.c)} 的点折叠，点 A 在 ${n(q.a)}。它与表示什么数的点重合？`;}if(type==='center'){q.answer=(q.a+q.b)/2;q.title=`折叠后，表示 ${n(q.a)} 和 ${n(q.b)} 的两点重合。折点表示什么数？`;}if(type==='move'){q.answer=q.a+q.d*q.v*q.t;q.title=q.speed?`点 P 从 ${n(q.a)} 出发，向${q.d>0?'右':'左'}每秒移动 ${q.v} 个单位长度。${q.t} 秒后，P 表示什么数？`:`点 P 从 ${n(q.a)} 出发，向${q.d>0?'右':'左'}移动 ${q.v*q.t} 个单位长度。到达后表示什么数？`;}if(!input){q.options=[q.answer,q.answer+2,q.answer-2];let shift=Math.abs(Math.round(q.answer))%3;q.options=q.options.slice(shift).concat(q.options.slice(0,shift));}return q;}
function questions(i,r=0){const k=r%3;if(i===0)return [Q('distance',{a:-2-k,b:4+k}),Q('mid',{a:-2-k,b:4+k}),Q('mid',{a:-6+k,b:-2+k}),Q('mid',{a:1+k,b:5+k},true),Q('mid',{a:-4-k,b:4+k},true)];if(i===1)return [Q('fold',{a:-3-k,c:0}),Q('fold',{a:-2+k,c:1+k}),Q('center',{a:-4-k,b:2+k}),Q('fold',{a:4+k,c:1+k},true),Q('center',{a:-2+k,b:6+k},true)];return [Q('move',{a:5+k,d:-1,v:2,t:3,speed:true}),Q('expr',{a:-4-k,d:1,v:2}),Q('equation',{a:-6-k,b:6+2*k,v:2,w:1,kind:'meet'}),Q('meet',{a:-6-k,b:6+2*k,v:2,w:1},true),Q('chase',{a:-4-k,b:2+k,v:3,w:1},true)];}
function exitQuestions(){return[Q('mid',{a:-4,b:2}),Q('mid',{a:-5,b:-1},true),Q('fold',{a:-3,c:1}),Q('center',{a:-2,b:4},true),Q('move',{a:4,d:-1,v:2,t:3,speed:true}),Q('expr',{a:5,d:-1,v:2}),Q('meet',{a:-5,b:7,v:1,w:2},true),Q('chase',{a:-3,b:5,v:4,w:2},true)];}
function newRun(i){return{qs:questions(i,S.lessons[i].runs.length),draft:{},snapshot:null,submittedAt:null};}
function runFor(i){const l=S.lessons[i];if(!l.runs.length)l.runs.push(newRun(i));return l.runs[l.current]||l.runs[0];}
function nav(){const done=[0,1,2].filter(learned).length;$('#sidebar').innerHTML=`<div class="brand">数学破局者<small>七年级 · 数轴基础自学</small></div><nav class="nav" aria-label="学习目录"><button data-page="home" class="${S.page==='home'?'active':''}"><span class="num">○</span>学习起点</button>${titles.map((t,i)=>`<button data-page="l${i}" class="${S.page==='l'+i?'active':''}"><span class="num">0${i+1}</span>${t}<span class="done">${learned(i)?'✓':''}</span></button>`).join('')}<button data-page="notes" class="${S.page==='notes'?'active':''}"><span class="num">≡</span>知识笔记</button><button data-page="exit" class="${S.page==='exit'?'active':''}"><span class="num">↗</span>出门条 ${passedExit()?'✓':''}</button><button data-page="record" class="${S.page==='record'?'active':''}"><span class="num">↺</span>学习记录与错题</button></nav><div class="sidebottom">学习进度 · ${done}/3 关<div class="progress"><i style="width:${done/3*100}%"></i></div>${completed()?'本次学习已完成':'按照自己的节奏，一步一步来。'}<br>记录保存在当前浏览器<button class="small" style="margin-top:12px" data-action="export">导出学习记录</button></div>`;}
function pageTop(){return`<div class="topline"><button class="mobilemenu small" data-action="menu">☰ 学习目录</button><span>有理数 / 数轴上的位置</span><span class="pill">基础篇 · 建议分次学习</span></div>`;}
function axis(points=[],opts={}){const small=window.innerWidth<700,min=opts.min??-8,max=opts.max??8,W=small?480:760,H=300,Y=173,left=small?32:48,right=W-45;const x=v=>left+(v-min)/(max-min)*(right-left);let ticks='';const interval=max-min>20?2:1;const labelEvery=small?(max-min>20?4:2):interval;for(let v=Math.ceil(min);v<=max;v+=interval)ticks+=`<line x1="${x(v)}" x2="${x(v)}" y1="${Y}" y2="${Y+(v===0?13:8)}" stroke="#71867a"/><text x="${x(v)}" y="${Y+36}" text-anchor="middle" fill="${v===0?'#21664f':'#617468'}" font-size="${small?19:max-min>20?17:18}">${v%labelEvery===0?n(v):''}</text>`;let line=`<line x1="25" x2="${W-24}" y1="${Y}" y2="${Y}" stroke="#667e70" stroke-width="2"/><path d="M${W-24} ${Y}l-11 -6v12z" fill="#667e70"/>${ticks}`;
let extra='';if(opts.center!==undefined){extra+=`<line x1="${x(opts.center)}" x2="${x(opts.center)}" y1="28" y2="230" stroke="#21664f" stroke-width="2" stroke-dasharray="6 5"/><text x="${x(opts.center)}" y="22" text-anchor="middle" fill="#21664f" font-size="18">折点 ${n(opts.center)}</text>`;}
if(opts.segments)opts.segments.forEach((s,j)=>{let y=68+j*32;extra+=`<path d="M${x(s.a)} ${y+7}v-7H${x(s.b)}v7" fill="none" stroke="${s.color||'#21664f'}" stroke-width="3"/><text x="${(x(s.a)+x(s.b))/2}" y="${y-9}" text-anchor="middle" fill="${s.color||'#21664f'}" font-size="18">${s.label}</text>`;});
if(opts.arrow){const s=opts.arrow,xa=x(s.a),xb=x(s.b);extra+=`<path d="M${xa} 141Q${(xa+xb)/2} 65 ${xb} 141" fill="none" stroke="#bd632e" stroke-width="3"/><path d="M${xb} 141l${xb>=xa?'-12':'12'} -5l3 -9z" fill="#bd632e"/>`;}
const pt=points.map((p,j)=>{const xx=x(p.v),yy=p.y??Y,color=p.color||'#3c68a1',labelY=p.labelY??(p.below?Y+80:yy-20);return`<g ${p.drag?`class="svgpoint" data-drag="${p.drag}" tabindex="0" role="slider" aria-label="${p.label}的位置" aria-valuemin="${min}" aria-valuemax="${max}" aria-valuenow="${p.v}"`:''}><circle cx="${xx}" cy="${yy}" r="23" fill="transparent"/><circle cx="${xx}" cy="${yy}" r="8" fill="${color}" stroke="#fffef9" stroke-width="3"/>${p.y===230?`<line x1="${xx}" x2="${xx}" y1="${Y}" y2="230" stroke="${color}" stroke-dasharray="3 4"/>`:''}<text x="${xx}" y="${labelY}" fill="${color}" text-anchor="middle" font-size="20" font-weight="600">${p.noLabel?'':p.label+(p.hideValue?'':' = '+n(p.v))}</text></g>`;}).join('');return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'可操作数轴')}" data-min="${min}" data-max="${max}" data-width="${W}" data-left="${left}" data-right="${right}">${line}${extra}${pt}</svg>`;}
function home(){return`${pageTop()}<section class="hero"><div><div class="eyebrow">从看懂一条数轴开始</div><h1>找到中点，<br>看懂折叠与移动。</h1><p>先看图，再试一试。<br>用小数字，把每一步想明白。</p><div class="actions"><button class="primary" data-page="${S.last}">${S.lessons.some(l=>l.read.some(Boolean))?'继续学习':'从中点开始'} →</button><button data-page="notes">知识笔记</button></div></div><div class="heroart">${axis([{v:-4,label:'A',color:'#3c68a1'},{v:0,label:'中点',color:'#21664f',below:true},{v:4,label:'B',color:'#bd632e'}],{min:-6,max:6,segments:[{a:-4,b:0,label:'一样长'},{a:0,b:4,label:'一样长',color:'#bd632e'}]})}<p>中点把一段距离分成相等的两半。</p></div></section><div class="callout"><strong>本次重点</strong>　理解中点为什么这样算；沿折点找另一侧同样远的位置；根据左右方向求移动后的位置。</div><div class="route">${titles.map((t,i)=>`<div class="route-row"><div class="n">0${i+1}</div><div><h3>${t}</h3><p>${descs[i]} · 约 ${i===0?'12':'10'} 分钟</p></div><button class="small" data-page="l${i}">${learned(i)?'回顾这一关':'进入这一关'} →</button></div>`).join('')}</div><p class="footertext">每关：看例子 → 操作数轴 → 理解方法 → 5题检测 → 总结。可以随时回看；答错后有图解。最后用6道出门条检查本次学习。</p>`;}
function drawing(inner,hint=''){return`<div class="drawing">${inner}${hint?`<div class="graphhint">${hint}</div>`:''}</div>`;}
function stepsText(lines){return`<div class="calcsteps">${lines.map((t,j)=>`<div class="calcstep"><span class="bubble">${j+1}</span><p>${t}</p></div>`).join('')}</div>`;}
function demo(i){const d=S.lessons[i].demo;let content,figure;
if(i===0){content=`<p>点 A 在 <b>−2</b>，点 B 在 <b>4</b>。我们要找它们的<strong>中点 M</strong>。</p><p>中点在 A、B 之间，而且到两边<strong>一样远</strong>。</p>${stepsText(['先看整段距离：从 −2 走到 4，一共 <b>6 格</b>。<br>4 − (−2) = 6',...(d>=1?['一半是多少？<br><b>6 ÷ 2 = 3</b>，从 A 出发只走 3 格。']:[]),...(d>=2?['从 −2 向右走 3 格：<br><b>−2 + 3 = 1</b>，所以中点在 1。']:[])])}<div class="actions"><button data-action="demo" class="primary">${d===0?'① 把距离分成两半':d===1?'② 找到中点的位置':'再看一遍'}</button></div>`;figure=drawing(axis([{v:-2,label:'A'}, {v:4,label:'B',color:'#bd632e'},...(d>=2?[{v:1,label:'M',color:'#21664f',below:true}]:[])],{segments:d>=1?[{a:-2,b:1,label:'3 格'},{a:1,b:4,label:'3 格',color:'#bd632e'}]:[{a:-2,b:4,label:'整段 6 格'}]}),'中点表示的数是 1；“一半的长度”是 3。它们不是同一个量。');}
if(i===1){content=`<p>在表示 <b>1</b> 的位置折一下，点 A 在 <b>−2</b>。A 会落在哪里？</p><p><strong>折点</strong>就是纸条折弯的位置。点折过去后，到折点的距离保持不变。</p>${stepsText(['点 A 在折点左边，离折点：<br><b>1 − (−2) = 3</b> 个单位长度。',...(d>=1?['折过去后，要在折点<strong>右边</strong>找同样远的点。']:[]),...(d>=2?['从 1 向右走 3 格：<br><b>1 + 3 = 4</b>，所以 −2 与 4 重合。']:[])])}<div class="actions"><button class="primary" data-action="demo">${d===0?'① 看折点另一边':d===1?'② 找到重合的位置':'再看一遍'}</button></div>`;figure=drawing(axis([{v:-2,label:'A'},...(d>=2?[{v:4,label:'对应点',color:'#bd632e',below:true}]:[])],{center:1,segments:[{a:-2,b:1,label:'3 格'},...(d>=1?[{a:1,b:4,label:'也走 3 格',color:'#bd632e'}]:[])]}),'折点在这两个重合点的正中间。');}
if(i===2){content=`<p>点 P 从 <b>−3</b> 出发，向<strong>右</strong>移动 <b>5</b> 个单位长度。</p><p>数轴上越往右，表示的数越大；越往左，表示的数越小。</p>${stepsText(['起点是 −3。先确定“从哪里出发”。',...(d>=1?['向右走，用加法：<br><b>−3 + 5</b>。']:[]),...(d>=2?['依次经过 −2、−1、0、1、2。<br><b>−3 + 5 = 2</b>，最后停在 2。']:[])])}<div class="actions"><button class="primary" data-action="demo">${d===0?'① 先判断方向':d===1?'② 数一数，找到终点':'再看一遍'}</button></div>`;figure=drawing(axis([{v:-3,label:'起点'},...(d>=2?[{v:2,label:'P',color:'#bd632e',below:true}]:[])],{arrow:d>=1?{a:-3,b:2}:null}),d>=1?'向右 5 格 → 用加法；跨过 0 也照样计算。':'先找到 −3，再想向哪边走。');}
return`<div class="teaching"><div>${content}</div><div class="stickyfig">${figure}</div></div>`;}
function labDefault(i){return i===0?{a:-2,b:4}:i===1?{a:-2,c:1,fold:0}:{a:-3,d:1,v:1,t:5};}
function lab(i){return S.lessons[i].lab||(S.lessons[i].lab=labDefault(i));}
function control(label,key,value,min,max,step=1){return`<label class="control"><span>${label}</span><input type="range" data-control="${key}" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${label}"><input type="number" data-control="${key}" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${label}数值"></label>`;}
function labFigure(i){const z=lab(i);if(i===0){let lo=Math.min(z.a,z.b),hi=Math.max(z.a,z.b),m=(z.a+z.b)/2,h=(hi-lo)/2;return axis([{v:z.a,label:'A',drag:'a'},{v:z.b,label:'B',drag:'b',color:'#bd632e'},{v:m,label:'M',below:true,color:'#21664f'}],{segments:[{a:lo,b:m,label:n(h)+' 格'},{a:m,b:hi,label:n(h)+' 格',color:'#bd632e'}]});}if(i===1){const target=2*z.c-z.a,theta=z.fold*Math.PI;return axis([{v:z.a,label:'A',drag:'a'},{v:z.c,label:'折点',drag:'c',color:'#21664f',below:true,hideValue:true,noLabel:true},...(z.fold>0?[{v:z.c+(z.a-z.c)*Math.cos(theta),y:173-Math.abs(z.a-z.c)*Math.sin(theta)*13,label:z.fold===1?'折后 A':'折叠中',hideValue:z.fold!==1,color:'#bd632e',below:z.fold===1}]:[])],{min:-14,max:14,center:z.c,segments:z.fold===1?[{a:Math.min(z.a,z.c),b:Math.max(z.a,z.c),label:n(Math.abs(z.c-z.a))+' 格'},{a:Math.min(target,z.c),b:Math.max(target,z.c),label:n(Math.abs(z.c-z.a))+' 格',color:'#bd632e'}]:[]});}const end=z.a+z.d*z.v*z.t;return axis([{v:z.a,label:'起点',drag:'a'}, {v:end,label:'P',color:'#bd632e',below:true}],{min:-16,max:16,arrow:z.t?{a:z.a,b:end}:null});}
function labReadout(i){const z=lab(i);if(i===0)return`中点 M = <b>${n((z.a+z.b)/2)}</b>　两边各 <b>${n(Math.abs(z.a-z.b)/2)}</b> 格`;if(i===1)return z.fold===1?`折点 <b>${n(z.c)}</b>　A 在 <b>${n(z.a)}</b>　对应点在 <b>${n(2*z.c-z.a)}</b>`:'先预测另一侧的位置，再点击“折过去”验证。';return`走了 <b>${z.v} × ${z.t} = ${z.v*z.t}</b> 格　${n(z.a)} ${z.d>0?'+':'−'} ${z.v*z.t} = <b>${n(z.a+z.d*z.v*z.t)}</b>`;}
function exploration(i){const z=lab(i);const tasks=[['把 A、B 放在 −2 和 4，观察中点和两边长度。','再试 −4 和 2；最后试 1 和 5。','每次点“记下这次观察”，比较：中点一定是 0 吗？'],['先预测：沿 1 折叠，−2 会落在哪里？点击“折过去”核对。','再试沿 0 折叠 −3；沿 −1 折叠 −4。','每次比较两边的长度：折点两侧是不是一样远？'],['先试从 −3 向右走 5 格，再从 −3 向左走 2 格。','再试从 1 出发，向左每秒走 2 格，走 2 秒。','看“速度 × 时间”得到的是走过的格数，再看终点在哪里。']][i];let controls=i===0?control('点 A', 'a',z.a,-8,8)+control('点 B','b',z.b,-8,8):i===1?control('点 A','a',z.a,-6,6)+control('折点','c',z.c,-3,3):control('起点','a',z.a,-6,6)+`<label class="control"><span>方向</span><select data-select="d" aria-label="移动方向"><option value="1" ${z.d===1?'selected':''}>向右 →</option><option value="-1" ${z.d===-1?'selected':''}>向左 ←</option></select></label>`+control('每秒走几格','v',z.v,1,2)+control('走几秒','t',z.t,0,5);
return`<p class="muted">按下面的任务做三次比较。你也可以拖动有颜色的点，或用滑块、数字框修改。</p><div class="teaching"><div>${stepsText(tasks)}<div class="preset" style="margin-top:20px">${[0,1,2].map(j=>`<button class="small" data-preset="${j}">尝试 ${j+1}</button>`).join('')}</div><div class="controls">${controls}</div>${i===1?'<button class="primary" data-action="fold">折过去 / 展开</button>':''}<div class="actions"><button data-action="observe">＋ 记下这次观察</button></div></div><div class="stickyfig"><div class="drawing"><div id="labsvg">${labFigure(i)}</div><div class="readouts" id="labread" aria-live="polite">${labReadout(i)}</div><div class="graphhint">圆点可拖动；选中圆点后可用键盘左右键。滑块也能改变数值。</div></div></div></div><div class="panel"><h3>我的观察记录</h3><div id="observations">${observationTable(i)}</div></div><details><summary>想一想，再展开核对</summary><div class="callout">${['中点到两端的距离相等，但中点不一定在 0。只有两端互为相反数时，中点才在 0。','折点不一定是原点。无论在哪儿折，原来的点和对应点到折点的距离都相等。','方向决定加还是减；速度乘时间得到路程。起点也要参与计算，路程不一定等于终点表示的数。'][i]}</div></details>`;}
function observationTable(i){const rows=S.lessons[i].observations;const heads=[['A','B','中点','两边各长'],['原来的点','折点','对应点','两边各长'],['起点','方向','路程','终点']][i];return rows.length?`<div class="observation"><table><thead><tr>${heads.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`:'<p class="muted">暂时还没有记录。完成一次尝试后，点击“记下这次观察”。</p>';}
function method(i){if(i===0)return`<h3>为什么是“两个数相加，再除以 2”？</h3><div class="teaching"><div><p>仍然看 A 在 −2、B 在 4 的例子。</p>${stepsText(['先求距离的一半：<b>[4 − (−2)] ÷ 2 = 3</b>。','从左端 −2 向右走这一半：<b>−2 + 3 = 1</b>。','还可以把两端的数“平均”：<b>(−2 + 4) ÷ 2 = 1</b>。'])}<div class="callout">想象从两个端点<strong>各向中间走同样远</strong>。左端增加多少，右端就减少多少，所以两个数的<strong>和不变</strong>。碰到一起时都是中点的数。</div></div><div>${drawing(axis([{v:-2,label:'A'},{v:4,label:'B',color:'#bd632e'},{v:1,label:'M',below:true,color:'#21664f'}],{segments:[{a:-2,b:1,label:'向右 3 格'},{a:1,b:4,label:'向左 3 格',color:'#bd632e'}]}))}<div class="formula">−2 + 4 = 1 + 1</div><p>两个中点的数相加，等于原来两端的数之和。所以再除以 2，就得到一个中点的数。</p></div></div><div class="panel"><div class="eyebrow">把发现记下来</div><div class="formula big">中点表示的数 = ${frac('两端表示的数之和','2')}</div><p>若两端分别表示 <b>a、b</b>（这两个字母只是代替两个数），那么：</p><div class="formula">中点表示的数 = ${frac('a + b','2')}</div><p class="muted">先把两个带符号的数相加，再除以 2。例如：(−6 + (−2)) ÷ 2 = −4。</p></div><div class="callout tip"><b>别把“一半的长度”当成“中点的位置”。</b><br>本例的一半长度是 3；从 −2 出发走 3 格，中点才是 1。</div>`;
if(i===1)return`<h3>把折叠和中点连起来</h3><p>折叠后重合的两个点，到折点一样远。<strong>所以折点就是这两个点的中点。</strong></p><div class="summarygrid"><div class="panel"><div class="eyebrow">已知两个重合点 → 找折点</div><p>−2 与 4 重合，求折点。</p>${drawing(axis([{v:-2,label:'A'},{v:4,label:'对应点',color:'#bd632e',below:true}],{center:1,segments:[{a:-2,b:1,label:'3 格'},{a:1,b:4,label:'3 格',color:'#bd632e'}]}))}<div class="formula">(−2 + 4) ÷ 2 = 1</div><p>直接用刚学过的中点公式。</p></div><div class="panel"><div class="eyebrow">已知折点和原来的点 → 找对应点</div><p>沿 1 折叠，点 A 在 −2。</p>${stepsText(['到折点有多远？<br><b>1 − (−2) = 3</b>。','到折点<strong>另一侧</strong>走同样远。','从 1 向右走 3 格：<b>1 + 3 = 4</b>。'])}<div class="callout">先求“离折点多远”，再到另一侧找。画图数格也可以。</div></div></div><div class="callout tip">沿 0 折叠时，−3 与 3 重合。<br>沿 1 折叠时，−2 与 4 重合。<strong>折叠后的两个数不一定互为相反数。</strong></div>`;
return`<h3>先看方向，再算路程，最后找位置</h3><div class="compare"><div><p>向右移动 → 数变大</p><b>终点 = 起点 + 路程</b><p>从 −3 向右走 5 格：<br>−3 + 5 = 2</p></div><div><p>向左移动 ← 数变小</p><b>终点 = 起点 − 路程</b><p>从 2 向左走 5 格：<br>2 − 5 = −3</p></div></div><div class="panel"><h3>如果题目给的是速度和时间呢？</h3><p>点 P 从 −4 出发，向右每秒移动 2 个单位长度，走 3 秒。</p><div class="teaching"><div>${stepsText(['每秒 2 格，3 秒共走：<br><b>2 × 3 = 6</b> 格。','向右，用加法。<br><b>−4 + 6 = 2</b>。','所以点 P 最后在 <b>2</b>。'])}</div>${drawing(axis([{v:-4,label:'起点'},{v:2,label:'P',below:true,color:'#bd632e'}],{arrow:{a:-4,b:2}}),'路程 = 速度 × 时间；终点 = 起点 + 向右走的路程。')}</div></div><div class="callout tip">题目里的“每秒走几格”是速度；乘上秒数才是路程。路程是 6，不代表终点就在 6。</div>`;}
function explanation(q){if(isMotionQ(q))return motionExplanation(q);let lines,points,opts={};if(q.type==='mid'||q.type==='center'){let lo=Math.min(q.a,q.b),hi=Math.max(q.a,q.b),h=(hi-lo)/2;lines=[q.type==='center'?'重合的两个点到折点一样远，所以折点是它们的中点。':'中点在两个端点之间，到两边一样远。',`两端相加再除以 2：(${n(q.a)} + ${par(q.b)}) ÷ 2 = ${n(q.answer)}。`,`也可从左端 ${n(lo)} 向右走 ${n(h)} 格，得到 ${n(q.answer)}。`];points=[{v:q.a,label:'A'},{v:q.b,label:'B',color:'#bd632e'},{v:q.answer,label:q.type==='center'?'折点':'M',color:'#21664f',below:true}];opts.segments=[{a:lo,b:q.answer,label:n(h)+' 格'},{a:q.answer,b:hi,label:n(h)+' 格',color:'#bd632e'}];}else if(q.type==='distance'){lines=['距离是在数轴上相隔的长度，不能是负数。',`用右边的数减左边的数：${n(Math.max(q.a,q.b))} − ${par(Math.min(q.a,q.b))} = ${n(q.answer)}。`,`所以两点相距 ${n(q.answer)} 个单位长度。`];points=[{v:q.a,label:'A'},{v:q.b,label:'B',color:'#bd632e'}];opts.segments=[{a:Math.min(q.a,q.b),b:Math.max(q.a,q.b),label:n(q.answer)+' 格'}];}else if(q.type==='fold'){let dist=Math.abs(q.a-q.c);lines=[`点 A 在折点${q.a<q.c?'左':'右'}侧，离折点 ${dist} 格。`,`对应点要在折点另一侧，所以从 ${n(q.c)} 向${q.a<q.c?'右':'左'}走 ${dist} 格。`,`${n(q.c)} ${q.a<q.c?'+':'−'} ${dist} = ${n(q.answer)}，所以对应点在 ${n(q.answer)}。`];points=[{v:q.a,label:'A'},{v:q.answer,label:'折后 A',color:'#bd632e',below:true}];opts.center=q.c;}else{let len=q.v*q.t;lines=[`从 ${n(q.a)} 出发，方向向${q.d>0?'右，用加法':'左，用减法'}。`,q.speed?`先算路程：${q.v} × ${q.t} = ${len} 个单位长度。`:`移动的路程是 ${len} 个单位长度。`,`${n(q.a)} ${q.d>0?'+':'−'} ${len} = ${n(q.answer)}，最后的位置是 ${n(q.answer)}。`];points=[{v:q.a,label:'起点'},{v:q.answer,label:'终点',color:'#bd632e',below:true}];opts.arrow={a:q.a,b:q.answer};}let values=points.map(p=>p.v);opts.min=Math.min(-8,...values)-2;opts.max=Math.max(8,...values)+2;return{lines,points,opts};}
function reviewFigure(q,id){if(isMotionQ(q))return motionReview(q,id);const e=explanation(q);return`<div class="drawing"><div class="qgraph" id="graph-${id}">${axis([...e.points,{v:q.answer,label:'验证点',color:'#8a4e87',drag:'review:'+id,y:230,labelY:285}],e.opts)}</div><div style="padding:0 16px 14px"><label style="font-size:14px">验证任务：${q.type==='distance'?'把验证点依次移到 A、B，沿数轴数一数间隔。':`把验证点先移到 ${n(q.answer)}，再移到 ${n(q.answer+1)}，比较哪个位置符合题意。`}<input class="review-slider" type="range" min="${e.opts.min}" max="${e.opts.max}" step="0.5" value="${q.answer}" data-review="${id}" aria-label="第${id.split('-').pop()}题验证点"></label><div class="muted" id="feedback-${id}" style="font-size:13px">${verifyText(q,q.answer)}</div></div></div>`;}
function verifyText(q,v){if(q.type==='mid'||q.type==='center')return`验证点在 ${n(v)}：到 A 距离 ${n(Math.abs(v-q.a))}，到 B 距离 ${n(Math.abs(v-q.b))}。${Math.abs(v-q.a)===Math.abs(v-q.b)?'两边一样远。':'两边不一样远。'}`;if(q.type==='fold')return`验证点在 ${n(v)}：到折点 ${n(Math.abs(v-q.c))} 格；A 到折点 ${n(Math.abs(q.a-q.c))} 格。还要检查是否位于折点另一侧。`;if(q.type==='distance')return`验证点在 ${n(v)}：到 A 距离 ${n(Math.abs(v-q.a))}，到 B 距离 ${n(Math.abs(v-q.b))}。`;return`从 ${n(q.a)} 到 ${n(v)}，实际${v>=q.a?'向右':'向左'}移动 ${n(Math.abs(v-q.a))} 格；题目要求向${q.d>0?'右':'左'}移动 ${q.v*q.t} 格。`;}
function quizHTML(run,prefix){return run.qs.map((q,j)=>{let id=prefix+'-'+j,ans=run.draft[j]??'',submitted=run.snapshot!==null,old=run.snapshot?.[j]??'',blank=String(old).trim()==='',ok=correct(q,old),e=explanation(q);return`<section class="question"><div class="qhead"><span class="qnumber">${String(j+1).padStart(2,'0')}</span><div class="qtitle">${q.title}</div></div>${q.input?`<label>答案：<input class="answerinput" type="text" inputmode="decimal" data-answer="${j}" value="${esc(ans)}" aria-label="第${j+1}题答案" placeholder="填一个数"></label>`:`<div class="options">${q.options.map((o,k)=>`<label class="option"><input type="radio" name="${id}" data-answer="${j}" value="${o}" ${String(ans)===String(o)?'checked':''}>${String.fromCharCode(65+k)}. ${q.optionLabels?esc(q.optionLabels[k]):n(o)}</label>`).join('')}</div>`}${submitted?`<div class="status ${ok?'good':'bad'}">${ok?'✓ 正确':blank?'○ 未作答':'再想一想'}${ok?'':` · 上次答案：${blank?'空白':esc(q.optionLabels?q.optionLabels[q.options.indexOf(Number(old))]:old)} · 正确答案：${answerText(q)}`}</div><details ${!ok?'open':''}><summary>看图理解与验证</summary><div class="explainbox">${stepsText(e.lines)}${reviewFigure(q,id)}</div></details>`:''}</section>`;}).join('');}
function scoreHTML(run){const x=score(run);return`<div class="score"><div class="large">${x.good}<span style="font-size:24px;color:var(--muted)"> / ${x.total}</span></div><div><p><b>本轮正确率 ${x.pct}%</b></p><p class="muted">正确 ${x.good} · 错答 ${x.wrong} · 未答 ${x.blank}</p><p style="font-size:13px">正确率按全部 ${x.total} 题计算，空题也计入分母。</p></div></div>`;}

const takeaways=[['中点在两端之间，到两端一样远。','中点表示的数 = 两端表示的数之和 ÷ 2。','半段长度不是中点的位置；起点也要算进去。'],['折点是折叠后重合的两个点的中点。','找对应点：先求到折点的距离，再到另一侧走同样远。','折点不一定是 0；只有沿 0 折叠才得到互为相反数的两个数。'],['向右用加，向左用减；路程 = 速度 × 时间。','从 a 出发，速度 v，t 秒后位置：向右 a + vt，向左 a − vt。','相遇或追上：分别写两个点的位置，让位置表达式相等，再解方程。','相向：间距每秒缩短速度之和；同向且后点更快：间距每秒缩短速度之差。','解出的 t 是时间；再代回任一位置表达式，得到相遇或追上的位置，并核对另一点。']];

function notes(){return`${pageTop()}<div class="eyebrow">知识笔记 · 可以照着整理</div><h2>三件事，慢慢想清楚</h2><div class="note"><h3>① 中点：把一段距离平分</h3><p><strong>位置在两端之间，到两端的距离相等。</strong></p><div class="formula">中点表示的数 = ${frac('两端表示的数之和','2')}</div><p>例如：(−2 + 4) ÷ 2 = 1。<br>先求一半长度，再从左端向右走，也能找到同一个中点。</p></div><div class="note"><h3>② 折叠：另一侧，同样远</h3><p><strong>折点是两个重合点的中点。</strong></p><div class="compare"><div>找折点：<br>两个重合点的数相加，再除以 2。</div><div>找对应点：<br>求出到折点的距离，到另一侧走同样远。</div></div><p style="margin-top:12px">例如：−2 和 4 重合，折点是 1；沿 1 折叠，−2 的对应点在 4。</p></div><div class="note"><h3>③ 动点：由位置表达式列方程</h3><div class="compare"><div><b>向右：起点 + 路程</b></div><div><b>向左：起点 − 路程</b></div></div><div class="formula">路程 = 速度 × 时间</div><p>例如：从 −4 向右每秒走2格，t秒后位置为 <strong>−4 + 2t</strong>。当 t = 3 时，位置为 −4 + 6 = 2。</p><div class="compare" style="margin-top:18px"><div><b>相向相遇</b><p>P：−6 + 2t；Q：6 − t。<br>位置相等：−6 + 2t = 6 − t。<br>3t = 12，t = 4秒，相遇位置2。<br>相向时每秒缩短：速度之和。</p></div><div><b>同向追及</b><p>P：−4 + 3t；Q：2 + t。<br>位置相等：−4 + 3t = 2 + t。<br>2t = 6，t = 3秒，追上位置5。<br>后点更快时每秒缩短：速度之差。</p></div></div><p style="margin-top:16px">两点同时出发，匀速移动：<strong>设时间 → 分别写位置 → 令位置相等 → 解方程 → 代回检查</strong>。时间和相遇位置不是同一个答案。</p></div><div class="callout tip">最后检查：我求的是<strong>长度</strong>，还是<strong>位置</strong>？折点两侧是否同样远？移动方向有没有看反？</div><div class="actions"><button class="primary" data-page="exit">去做8题出门条 →</button><button data-action="export">导出学习记录</button></div>`;}

function setLab(i,key,value){const z=lab(i);let bounds=i===0?{a:[-8,8],b:[-8,8]}:i===1?{a:[-6,6],c:[-3,3]}:{a:[-6,6],v:[1,2],t:[0,5]};let [lo,hi]=bounds[key]||[-1,1];z[key]=Math.max(lo,Math.min(hi,Math.round(value)));if(i===0&&z.a===z.b){z[key]=z[key]===hi?z[key]-1:z[key]+1;}if(i===1)z.fold=0;updateLab(i);}

const GUIDE=[
 {tag:'起点 · 从距离到中点',goal:'先看懂两点之间的距离，再通过移动和比较，理解中点公式为什么成立。',steps:[
  {title:'先看位置，再量两点相隔多远',mode:'mid',a:-2,b:4,x:-2,targets:[-2,0,4],read:['我们已经会在数轴上找数。蓝色点 A 在 −2，紫色点 B 在 4。现在先不急着找中点，想一个更小的问题：从 A 走到 B，一共要走几格？','橙色点 P 可以移动。把它当作你现在走到的位置：蓝色的 AP 是已经走过的距离，紫色的 PB 是还没走完的距离。<strong>点的位置可以是负数，走过的距离却不会是负数。</strong>'],task:'先把 P 放在 −2，再放在 0，最后放在 4。每次读出蓝色 AP 和紫色 PB，并沿着刻度数一数。',compare:'P 到达 B 时，蓝色 AP 就是整段 AB。它是不是 6 格？为什么不能把 −2 和 4 相加，当作这段距离？',ask:'从 −2 走到 4，两点相隔几个单位长度？',options:['2 个，因为 −2 + 4 = 2','6 个，因为从 −2 到 0 有2格，再到4有4格','−6 个，因为起点是负数'],answer:1,why:['从 −2 到 0 走2格，从 0 到 4 再走4格，所以一共是6格。也可以用右边的数减左边的数：4 − (−2) = 6。','这里的6表示一段长度。下一步，我们要把这6格分成一样长的两段，看看分界点在哪里。'],line:'两点距离：右边的数 − 左边的数',note:'本例 AB = 4 − (−2) = 6。先把长度看清，再去找中点。'},
  {title:'怎样才算走到了正中间？',mode:'mid',a:-2,b:4,x:0,targets:[0,1,2],read:['刚才我们知道 A、B 相隔6格。“中点”不是随便选一个在中间的点，而是要把整段距离<strong>分成相等的两半</strong>。','先把 P 放在0。它虽然是原点，但到 A 只有2格，到 B 却有4格，两边并不一样长。再向右移动一点，蓝色 AP 会变长，紫色 PB 会变短。你能让它们刚好一样长吗？'],task:'依次把 P 放在 0、1、2。比较每次蓝色 AP 和紫色 PB 的读数，把三次观察记下来。',compare:'哪个位置两边都是3格？从左端 −2 走3格，停下来的位置是3，还是1？',ask:'A 在 −2、B 在4，它们的中点在哪里？',options:['在0，因为0是原点','在3，因为半段距离是3','在1，因为到两边都是3格'],answer:2,why:['整段是6格，分成两半，每半段是 6 ÷ 2 = 3 格。但3是“要走多远”，还不是“最后站在哪里”。','要从左端 −2 出发，向右走3格，所以中点是 −2 + 3 = 1。把 P 放在1，图中 AP 和 PB 都等于3，正好验证了这个结果。'],line:'先求一半的长度，再从左端向右走这一半。',note:'中点在两端之间，到两端的距离相等。半段长度是3，中点表示的数是1。'},
  {title:'为什么“两个数相加，再除以2”？',mode:'average',a:-2,b:4,x:0,targets:[0,1,3],read:['找中点还有一个更直接的办法：把两端表示的数相加，再除以2。这个办法从哪里来？我们让两端<strong>各向中间走同样远</strong>，一起看一看。','A 向右走1格，从 −2 变成 −1；B 向左走1格，从4变成3。一个增加1，另一个减少1，它们的和还是2。继续这样走，两端最终会在中点碰到一起。'],task:'把“每端走的格数”依次改成 0、1、3。看蓝色点、紫色点怎样靠近；再比较下方“两个数的和”。',compare:'碰到一起时，两个点都在1。原来 −2 + 4 = 2，现在 1 + 1 = 2。为什么把这个和除以2，就能得到中点表示的数？',ask:'两端各向中间走同样远时，为什么两个数的和不变？',options:['一个数增加多少，另一个就减少多少','因为两端的数一直没有变','因为所有中点都在0'],answer:0,why:['向右走让 A 的数增加，向左走让 B 的数减少。两端走得一样远，增加和减少就抵消了，所以两数之和不变。','碰到一起时，两端都到了中点。原来两数的和，就等于“两份中点的数”。因此除以2，便得到一份中点的数。这里是 (−2 + 4) ÷ 2 = 1。'],line:'中点表示的数 = 两端表示的数之和 ÷ 2',note:'若两端分别表示 a、b，那么中点表示的数是 (a+b)÷2。字母只是代替两个数。'},
  {title:'换一组数，试着自己找中点',mode:'midapply',a:-4,b:2,x:0,targets:[-2,-1,0],read:['现在你已经知道公式的理由了。换成 A 在 −4、B 在2，先用纸笔算一算：(−4 + 2) ÷ 2。<strong>先相加，再除以2；负号也要一起算。</strong>','算出结果后，再把 P 拖到那个位置，检查蓝色 AP 和紫色 PB 是否一样长。你还可以切换“两端都是负数”和“两端都是正数”，看看同一个办法是否仍然成立。'],task:'先找 −4 和2的中点；再切换到 −6 和 −2、1和5。每组都先计算，再拖动 P 验证两边的长度。',compare:'两端都在原点左边时，中点还会是正数吗？检查你的答案是否位于两端之间。',ask:'−6 和 −2 的中点表示什么数？',options:['−4','4','−2'],answer:0,why:['先相加：−6 + (−2) = −8；再除以2：−8 ÷ 2 = −4。所以中点在 −4。','检查一下：从 −6 到 −4 是2格，从 −4 到 −2 也是2格，而且 −4 在两个端点之间。计算和图像相互印证，这样的答案就更可靠。'],line:'先算两端之和 → 再除以2 → 检查两边是否一样远',note:'这一关的中点，就是下一关折叠时的折点。'}]},
 {tag:'核心 · 让整段数轴折过去',goal:'亲眼看到数轴绕折点翻折、两个点重合，用“到折点一样远”解释折叠。',steps:[
  {title:'折的不是一个点，而是整段数轴',mode:'fold',a:-3,b:3,c:0,read:['把数轴想成画在一条纸带上。绿色虚线穿过0，这里就是<strong>折点</strong>。蓝色 A 在 −3，紫色 B 在3，它们分处折点两边。','点击播放，左半条纸带会绕着绿色折痕抬起来、翻向右边。请一直盯住蓝色 A：<strong>它会和纸带上的刻度一起移动</strong>，最后落在紫色 B 的位置上。'],task:'先完整播放一次。第二次把进度停在“刚抬起”“竖起来”“完全折好”这三个位置，看纸带、刻度和 A 怎样一起变化。',compare:'完全折好时，蓝色圆环和紫色圆点是不是套在一起？展开再看，A、B 到折点各有几格？',ask:'为什么 −3 和3能在沿0折叠后重合？',options:['因为它们离折点都一样远，都是3格','因为折叠会把所有点都变成3','因为所有点都会落在原点'],answer:0,why:['折叠时，纸带没有被拉长或压短。A 到折痕原来是3格，翻过去后仍然是3格；而 B 恰好也在折点另一侧3格的位置。','所以 A 会落在 B 上。这里的关键是“折点两侧，同样远”，不是把负号随便去掉。下一步我们把折点移开0，继续检查。'],line:'折叠后重合的两个点，到折点的距离相等。',note:'图中展示的是数轴的一段。纸带翻折过程中，长度保持不变。'},
  {title:'折点换成1，还会怎样重合？',mode:'fold',a:-2,b:4,c:1,read:['上一小节沿0折叠，−3和3重合。这次绿色折痕移到1，A 在 −2，B 在4。先数一数：从 −2 到1是3格，从1到4也是3格。','播放动画时，注意<strong>固定的是折点1</strong>，不是原点0。左边的刻度会一起翻向右边，A 最后仍会和 B 重合，因为折点两边的距离相等。'],task:'点击播放，先在半程暂停看折痕的位置，再继续到完全折好。然后点“展开”，重新数一数两边的3格。',compare:'这次重合的两个数是 −2 和4。它们互为相反数吗？折叠一定沿0进行吗？',ask:'沿1折叠，−2与4重合，这说明什么？',options:['重合的两个数一定互为相反数','只要到折点同样远且在两侧，就能重合','折点必须改回0才可以折叠'],answer:1,why:['从 −2 到1是3格，从1到4也是3格，所以折过去后能重合。−2和4并不互为相反数，但这不妨碍它们关于折点1对称。','我们更应该记住的是：折点在两个重合点的正中间。只有折点是0时，对应的两个数才互为相反数。'],line:'折点是两个重合点的中点。',note:'这就是前一关的中点知识在折叠中的用途。'},
  {title:'想让两个点重合，折痕应该在哪里？',mode:'foldfind',a:-4,b:2,c:-2,read:['这次 A 在 −4，B 在2。两个点已经给定，但折痕的位置还需要你来找。先试把折点放在 −2：A 到折点是2格，B 到折点却是4格，翻过去会发生什么？','如果 A 没落在 B 上，不要急着重播。先展开，再把折点换个位置，让左右两段一样长。你也可以用上一关的中点公式先算，再让动画帮你检查。'],task:'依次试折点 −2、−1、0。每次都先展开，设置折点，再完整播放。记录 A 最后落在哪里，比较它是否与 B 重合。',compare:'哪一次蓝色 A 与紫色 B 重合？那条折痕的位置，是否等于 (−4 + 2) ÷ 2？',ask:'要让 −4 和2重合，折点应该在什么数的位置？',options:['−2','−1','0'],answer:1,why:['用中点公式：(−4 + 2) ÷ 2 = −1。于是 A 到折点的距离是 −1 − (−4) = 3，B 到折点的距离是 2 − (−1) = 3。','沿 −1 折叠，两边一样长，A 正好落到 B。折点如果选在 −2或0，两边长度不相等，动画会清楚地显示两个点没有重合。'],line:'折点表示的数 = 两个重合点表示的数之和 ÷ 2',note:'先用中点公式确定折点，再用动画检查。'},
  {title:'知道折点，去另一侧找同样远的点',mode:'foldapply',a:4,b:-2,c:1,read:['这次从右侧的点开始：A 在4，折点在1。A 离折点有 4 − 1 = 3 格。要找折叠后的对应点，就从折点1向<strong>另一侧，也就是左侧</strong>走3格。','所以我们预测 A 会落在 1 − 3 = −2。现在让右半条纸带翻向左边，看 A 是否真的落在 −2。想清楚左右关系后，再换两组小数字试试。'],task:'先播放“4沿1向左折”。再切换“−2沿1向右折”和“−4沿−1向右折”。每次先预测，再看两个点是否重合。',compare:'A 原来在折点左边时，折后应该在右边；原来在右边时呢？为什么两次都要走同样多的格数？',ask:'A 在4，沿1折叠，A 的对应点在哪里？',options:['在 −4','在 −2','在3'],answer:1,why:['先算到折点的距离：4 − 1 = 3。A 原来在折点右边，所以对应点应在折点左边。','从1向左走3格：1 − 3 = −2。动画里右半条纸带翻到左边，A 与 −2重合，说明方向和长度都找对了。'],line:'先求离折点多远，再到另一侧找同样远的位置。',note:'本课只练一次折叠，且给出的条件能够明确确定位置。'}]},
 {"tag":"应用 · 位置表达式与一元一次方程","goal":"从方向和路程出发，用 t 表示位置，列方程解决简单相遇和追及。","steps":[{"nav":"方向与加减","title":"先用方向，决定位置怎样改变","mode":"motionDir","a":-3,"d":1,"v":1,"max":5,"targets":[0,3,5],"read":["我们先把熟悉的第一步说清楚：数轴上向右走，表示的数增加，用加法；向左走，表示的数减小，用减法。橙色点 P 从 −3 出发，走5格，方向不同，终点也不同。","先看“向右”：−3 + 5 = 2。再切换“向左”，回到同一个起点比较。<strong>路程都是5格，方向决定加减，起点也不能漏掉。</strong>后面有了速度和时间，这条规则仍然适用。"],"task":"保持起点 −3，向右依次走0、3、5格并记录；切换向左，再走5格。比较两个终点。","compare":"同样走5格，为什么一个终点是2，另一个是 −8？路程5和点表示的数，是同一回事吗？","ask":"从 −3 向左移动5格，应该怎样计算？","options":["−3 + 5 = 2","−3 − 5 = −8","只看路程，终点就是5"],"answer":1,"why":["向左时数减小，所以从起点 −3 减去路程5，得到 −8。向右时才是 −3 + 5 = 2。","路程描述走了多远，位置描述最后站在哪里。接下来，题目给的路程会藏在“速度 × 时间”里，我们先把它算出来。"],"line":"向右：起点 + 路程；向左：起点 − 路程。","note":"跨过0也照样判断方向，不需要换规则。"},{"nav":"速度与时间","title":"给定速度和时间，算出点到哪里","mode":"motionSpeed","a":-4,"d":1,"v":2,"max":3,"targets":[1,2,3],"read":["点 P 从 −4 出发，向右每秒移动2个单位长度。每秒2格就是速度。走1秒是2格，走2秒是4格，走3秒是6格，这些路程可以用同一个乘法求出。","<strong>路程 = 速度 × 时间。</strong>3秒后走过 2 × 3 = 6格，再结合起点和方向：−4 + 2 × 3 = 2。先乘后加，正好对应“先算路程，再算位置”。","试完向右，再切换向左。同样走3秒，路程仍是6格，但位置应是 −4 − 2 × 3 = −10。速度、时间和方向要分别读清楚。"],"task":"向右把时间依次设为1、2、3秒，核对路程和位置。再切换向左，重复1、2、3秒，比较算式的加减号。","compare":"3秒时路程是6格，为什么位置不一定是6？图下算式中的 −4、2、3 分别表示什么？","ask":"从 −4 向右每秒走2格，3秒后 P 表示什么数？","options":["6","2","−10"],"answer":1,"why":["先求路程：2 × 3 = 6格；再求位置：−4 + 6 = 2。连写为 −4 + 2 × 3 = 2。","若改成向左，起点和路程都不变，只把加号改为减号：−4 − 2 × 3 = −10。不能把速度2直接当成路程，也不能把路程6当成位置。"],"line":"位置 = 起点 ± 速度 × 时间","note":"向右选加，向左选减；速度用格/秒时，时间要用秒。"},{"nav":"用 t 表示位置","title":"时间还不知道，就用 t 先写出位置","mode":"motionT","a":-4,"d":1,"v":2,"max":4,"targets":[0,1,3],"read":["刚才我们把时间3代进 −4 + 2 × 3。现在题目只说“移动了 t 秒”，t 表示从出发到现在经过的时间，t ≥ 0。虽然不知道具体几秒，仍能按原来的顺序写式子。","每秒走2格，t秒走 <strong>2t</strong> 格；从 −4 向右走，位置就是 <strong>−4 + 2t</strong>。2t 表示2乘t，整个式子表示位置，不是在这里立刻求出一个数。","把 t 换成0、1、3，这个表达式依次给出 −4、−2、2。你已经会把数代入式子，现在反过来用一个式子概括这些位置。切换向左时，位置就变为 −4 − 2t。"],"task":"先向右，依次把 t 设为0、1、3，自己代入 −4 + 2t，再核对图。切换向左，代入 −4 − 2t，检查3秒后的位置。","compare":"t = 0 为什么必须回到起点 −4？2t 单独表示什么，−4 + 2t 又表示什么？","ask":"P 从 −4 向右每秒走2格，t秒后的位置应写成？","options":["2t","−4 + 2t","−4 + 2 + t"],"answer":1,"why":["速度乘时间得到路程，所以路程是2t；从 −4 向右走，位置为 −4 + 2t。式子中的起点不能省略。","当 t = 3 时，−4 + 2t = −4 + 2 × 3 = 2；当 t = 0 时，位置是 −4，正好还没出发。接下来让两个点同时走，分别写出它们的位置，就能用方程求相遇或追上的时间。"],"line":"从 a 出发：向右 a + vt；向左 a − vt。","note":"a 表示起点的数，v 表示速度，t 表示经过的时间（t ≥ 0）。"},{"nav":"相遇：列方程","title":"相向而行：什么时候站到同一个位置？","mode":"motionPair","kind":"meet","a":-6,"b":6,"v":2,"w":1,"d":1,"e":-1,"max":4,"targets":[0,2,4],"read":["蓝色点 P 从 −6 出发，每秒向右走2格；紫色点 Q 从6出发，每秒向左走1格。两点<strong>同时出发、匀速相向而行</strong>，设经过 t 秒相遇。因为同时出发，两个点的移动时间都用同一个 t。","先分别写位置：P 表示 −6 + 2t，Q 表示 6 − t。相遇时它们站在同一点，因此<strong>两个位置表达式相等</strong>：−6 + 2t = 6 − t。这就是方程的依据。","先用动画比较0秒、2秒和4秒，再展开下方讲解，看看怎样从方程求出时间。解出 t 后，要代回两边，检查它们是否确实表示同一个数。"],"task":"把时间依次调到0、2、4秒，看蓝色 P 和紫色 Q 的位置与两点间距。记录2秒和4秒，再播放到两点重合。","compare":"2秒时两个位置还不同；4秒时都是多少？相遇要求的是位置相等，还是两点各自走的路程相等？","ask":"设 t 秒后相遇，下列哪个方程符合这道题？","options":["2t = t","−6 + 2t = 6 − t","−6 + 2t = 6 + t"],"answer":1,"why":["P 向右，位置是 −6 + 2t；Q 向左，位置是 6 − t。相遇时位置相等，列方程：−6 + 2t = 6 − t。","两边同时加 t、加6，得到 2t + t = 6 + 6；合并同类项：3t = 12；两边除以3，得到 t = 4。","代回检查：P 表示 −6 + 2 × 4 = 2，Q 表示 6 − 4 = 2。因此4秒后在表示2的点相遇。两点各走8格和4格，路程并不相等。","也可以用距离核对：原来相隔12格，每秒一起缩短 2 + 1 = 3格，所以 3t = 12。这个方程与刚才的结果一致。"],"line":"分别写位置 → 相遇时位置相等 → 解方程 → 代回检查","note":"本题两点同时出发、速度不变。答案既要写时间4秒，也要分清相遇位置是2。"},{"nav":"追及：列方程","title":"同向而行：后面的快点什么时候追上？","mode":"motionPair","kind":"chase","a":-4,"b":2,"v":3,"w":1,"d":1,"e":1,"max":3,"targets":[0,1,3],"read":["换一种运动方式：蓝色 P 在 −4，紫色 Q 在2，两点<strong>同时向右匀速移动</strong>。P 每秒走3格，Q 每秒走1格。P 起初在后面，但比 Q 快，所以两点之间的距离会逐渐缩短。","设经过 t 秒追上。P 的位置是 −4 + 3t，Q 的位置是 2 + t。注意两点都向右，所以两个位置表达式都用加法。<strong>追上也表示站到同一个位置</strong>，列方程 −4 + 3t = 2 + t。","先观察前1秒发生了什么：P 向右3格，Q 也向右1格，所以间距只缩短2格。追及要考虑前面的点还在走，不能把它当成静止不动。"],"task":"把时间依次调到0、1、3秒，记录两点位置与间距。播放动画，看后面的蓝点追上前面的紫点；再展开讲解解方程。","compare":"开始相隔6格，1秒后还隔4格。为什么每秒缩短的是 3 − 1，而不是 3 + 1？","ask":"设 t 秒后追上，哪一个方程把两点的位置写对了？","options":["−4 + 3t = 2","−4 + 3t = 2 − t","−4 + 3t = 2 + t"],"answer":2,"why":["P、Q 都向右，所以位置分别是 −4 + 3t 和 2 + t。追上时位置相等：−4 + 3t = 2 + t。","两边同时减 t、加4，得到 3t − t = 2 + 4；合并同类项：2t = 6；解得 t = 3。","代回检查：P 表示 −4 + 3 × 3 = 5，Q 表示 2 + 3 = 5。所以3秒后在表示5的点追上。","用间距再核对：开始相隔6格，每秒缩短 3 − 1 = 2格，故 2t = 6。前面的点也在前进，所以不能用6 ÷ 3求时间。"],"line":"同向追及：后点更快；追上时，两个位置表达式相等。","note":"这一关的检测会让你选位置表达式、选方程，再独立求相遇和追及的时间。"}]}

function nav(){const done=[0,1,2].filter(learned).length;$('#topbar').innerHTML=`<div class="topbar"><button class="brand" data-page="home"><span class="brandicon">↔</span><span>数轴 · 破局者<small>读一读 · 动一动 · 想明白</small></span></button><div class="topactions"><span class="savestatus">${saveFailed?'本机保存暂不可用':'✓ 进度已保存在本机'}</span><button data-page="home">学习路线</button><button data-gaction="fullscreen" class="fullbtn">全屏</button><button data-gaction="help">说明</button></div></div>`;}
function routeSidebar(i){return`<aside class="sidebar"><div class="eyebrow">破局路线</div>${GUIDE.map((u,k)=>`<button class="navunit ${i===k?'active':''}" data-page="l${k}"><span class="navnum">${learned(k)?'✓':'0'+(k+1)}</span>${titles[k]}<small>${learned(k)?'学习已完成 · 可回来复习':'可以学习'}</small></button>`).join('')}<div class="sidefoot">学习可以慢一点，<br>每一步都要想明白。<div class="dotrow">${GUIDE.map((u,k)=>`<span class="${learned(k)?'yes':''}"></span>`).join('')}</div><div class="btnrow" style="margin-top:18px"><button data-page="record">我的错题</button><button data-page="notes">知识总结</button><button data-page="exit">出门条</button></div></div></aside>`;}
function overallStats(){let total=0,good=0;S.lessons.forEach(l=>{let r=l.runs[l.current];if(r?.snapshot){const x=score(r);total+=x.total;good+=x.good;}});return`<div class="stats"><div class="stat"><b>${[0,1,2].filter(learned).length}<small> / 3</small></b><span>已完成学习的关卡</span></div><div class="stat"><b>${S.lessons.reduce((n,l)=>n+l.guided.read.filter(Boolean).length,0)}<small> / ${GUIDE.reduce((sum,u)=>sum+u.steps.length,0)}</small></b><span>已读完的探究小节</span></div><div class="stat"><b>${total?Math.round(good/total*100)+'%':'—'}</b><span>当前各轮检测正确率 · 含未答题</span></div></div>`;}
function home(){return`<section class="hero"><div><div class="eyebrow">有理数 · 自主学习计划</div><h1 style="margin-top:13px">把数轴折起来，<br>让中点<em>看得见。</em></h1><p>从“两个点的正中间”开始，让一整段数轴翻折，亲眼看见两个点重合。每一步都有阅读引导、动手任务和思考问题，陪你把原因想明白。</p><div class="btnrow"><button class="primary" data-page="${S.last}">${S.lessons.some(l=>l.guided.read.some(Boolean))?'继续我的学习 →':'开始第一关 →'}</button><button data-page="record">我的错题</button><button data-gaction="foldentry">先看看折叠动画</button></div><p class="small" style="font-size:12px;margin-bottom:0">无需登录 · 可离线使用 · 进度保存在当前浏览器</p></div><div class="heroart"><div class="equation">折点，就是两个重合点的<span class="green">中点</span>。</div>${foldSVG({a:-2,b:4,c:1,angle:35},true)}<div class="artnote">整段纸带一起翻，刻度和点一起走。</div></div></section>${overallStats()}<section><div class="sectionhead"><h2>你的三关路线</h2><span class="small">前两关各四步，动点关五步；每关五题<br>各关可自由切换，检测不限制进度</span></div><div class="routes">${GUIDE.map((u,i)=>`<button class="route ${learned(i)?'passed':'current'}" data-page="l${i}"><span class="num">0${i+1}</span><h3>${titles[i]}</h3><p>${u.goal}</p><span class="status">${learned(i)?'✓ 学习已完成 · 回来复习':'开始探究 →'}</span></button>`).join('')}</div></section><section class="card exit-gateway"><div><div class="eyebrow">最后一步 · 出门条</div><h3>三关学完，再把方法连起来</h3><p>中点、一次折叠、位置表达式、简单相遇与追及。完成学习后，用8道小题检查理解。</p><p class="small">三关学习进度：${[0,1,2].filter(learned).length}/3</p></div><button class="primary" data-page="exit">查看出门条</button></section><div class="homefoot"><span>建议准备纸笔。先读引导，再操作图像；拿不准时展开解释，带着原因继续。</span><div class="btnrow"><button data-page="notes">知识总结</button><button data-action="export">导出学习记录</button></div></div>`;}
function lesson(i){const l=S.lessons[i],j=l.guided.step,u=GUIDE[i];if(l.stage===4){l.summary=true;save();}const learning=l.stage<3;const tabs=`<div class="tabs" aria-label="本关探究步骤">${u.steps.map((s,k)=>`<button class="steptab ${learning&&j===k?'active':''} ${l.guided.read[k]?'done':''}" data-gstep="${k}">${k+1}. ${s.nav||['先观察','再比较','找原因','会应用'][k]}</button>`).join('')}<button class="steptab ${l.stage===3?'active':''}" data-stage="3">五题检测</button><button class="steptab ${l.stage===4?'active':''}" data-stage="4">本关总结</button></div>`;return`<div class="wrap layout">${routeSidebar(i)}<div class="lessonmain"><button class="mobile-route" data-page="home">← 三关路线 · 已完成学习 ${[0,1,2].filter(learned).length}/3</button><div class="lessonhead"><div class="eyebrow">第 ${i+1} 关 / 共3关 · ${u.tag}</div><h2>${titles[i]}</h2><p>${u.goal}</p><div class="unitprogress"><div style="width:${l.guided.read.filter(Boolean).length/u.steps.length*100}%"></div></div></div><div class="btnrow"><button data-stage="4">本关总结 →</button>${i>0?`<button data-page="l${i-1}">← 上一关</button>`:''}</div>${tabs}${learning?guidedLearn(i):l.stage===3?'<section class="card">'+quiz(i)+'</section>':'<section class="card">'+summaryLesson(i)+'</section>'}</div></div>`;}
function guidedLearn(i){const l=S.lessons[i],j=l.guided.step,s=GUIDE[i].steps[j],z=gState(i);return`<section class="card guidedcard"><div class="learning ${s.mode.startsWith('fold')?'fold-learning':''}"><div class="reading"><div class="eyebrow">读一读 · 第 ${j+1} 步</div><h3>${s.title}</h3>${s.read.map(t=>`<p>${t}</p>`).join('')}<div class="task"><b>动一动 · 本次任务</b>${s.task}</div><div class="compare-guide"><div class="eyebrow">再试几次，比较着看</div><p>${s.compare}</p><p class="small">每完成一次尝试，可以“记录当前读数”。操作和思考题不计入检测成绩。</p></div></div><div class="card graphcard"><div class="graphtop"><h3>${s.mode.startsWith('fold')?'数轴纸带 · 实际翻折演示':s.mode==='motionPair'?(s.kind==='meet'?'两点相向移动 · 相遇':'两点同向移动 · 追及'):s.mode==='average'?'两端一起向中间走':s.mode.startsWith('mid')?'比较蓝色 AP 与紫色 PB':'一个点沿数轴移动'}</h3><span class="chip">${s.mode.startsWith('fold')?'播放 / 暂停 / 慢慢拖':'拖动 / 滑块 / ＋ −'}</span></div><div id="guidedGraph">${guidedSVG(i)}</div><div id="guidedValues">${guidedValues(i)}</div><div class="gcontrols">${guidedControls(i)}</div><div id="liveInsight" class="targetstatus">${liveInsight(i)}</div><div class="graphhint">${s.mode.startsWith('fold')?'绿色虚线是折痕；蓝色纸带与刻度一起翻折，紫色部分保持不动。':s.mode==='motionPair'?'蓝色是 P，紫色是 Q。拖动时间滑块，观察同一时刻的两个位置；动画停在相遇或追上的时刻。':'可拖动橙色点，也可使用滑块或加减按钮；键盘方向键同样可用。'}</div><div class="observations"><button data-gaction="record">记录当前读数</button><div id="guidedLog">${guidedLog(i)}</div></div></div></div><div class="reflection"><div class="eyebrow">想一想 · 不计入检测成绩</div><h3>${s.ask}</h3><div class="choices" role="group" aria-label="本步思考题">${s.options.map((t,k)=>`<button class="choice ${l.guided.choices[j]===k?'selected':''}" data-gchoice="${k}"><span class="letter">${String.fromCharCode(65+k)}</span><span>${t}</span></button>`).join('')}</div><button data-gaction="explain" style="margin-top:16px">查看本步讲解</button><div id="guidedFeedback" aria-live="polite">${l.guided.revealed[j]?guidedFeedback(i):''}</div></div><div class="stepfooter"><span class="small">可以先动手试一试，也可以查看解释；这些操作不会卡住下一步。</span><button class switch(b.dataset.gaction){case'foldentry':S.lessons[1].stage=0;S.lessons[1].guided.step=0;go('l1');break;case'explain':l.guided.revealed[j]=true;$('#guidedFeedback').innerHTML=guidedFeedback(i);save();break;case'next':l.guided.read[j]=true;l.read=[true,true,true];if(j<GUIDE[i].steps.length-1)goStep(j+1);else{stopPlay();l.stage=3;render();}break;case'play':playAnimation();break;case'pause':stopPlay();save();break;case'replay':playAnimation(true);break;case'reset':stopPlay();if(s.mode.startsWith('fold'))z.angle=0;else z.t=0;refreshGuide();save();break;case'record':{const rows=l.guided.logs[j]||(l.guided.logs[j]=[]);let item=isMotion(s)?[s.mode==='motionDir'?`走 ${n(z.t)} 格`:`t = ${n(z.t)} 秒`,motionInsight(motionSpec(s,z),z.t)]:s.mode.startsWith('fold')?[`折点 ${n(z.c)} · ${Math.round(z.angle/180*100)}%`,z.angle===180?`A 落在 ${n(2*z.c-z.a)}；${2*z.c-z.a===z.b?'与 B 重合':'与 B 不重合'}`:`AC=${n(Math.abs(z.a-z.c))}，CB=${n(Math.abs(z.b-z.c))}`]:s.mode==='average'?[`各走 ${n(z.x)} 格`,`${n(z.a+z.x)} + ${par(z.b-z.x)} = ${n(z.a+z.b)}`]:s.mode.startsWith('mid')?[`P = ${n(z.x)}`,`AP=${n(Math.abs(z.x-z.a))}，PB=${n(Math.abs(z.x-z.b))}`]:[`${n(z.t)} ${s.mode==='speed'?'秒':'格'}`,`路程 ${n(s.v*z.t)}，终点 ${n(s.a+s.d*s.v*z.t)}`];rows.push(item);if(rows.length>6)rows.shift();$('#guidedLog').innerHTML=guidedLog(i);save();break;}case'fullscreen':if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});break;case'help':{const d=document.createElement('div');d.className='dialogback';d.innerHTML='<div class="dialog" role="dialog" aria-modal="true" aria-label="学习说明"><h3>怎样使用这份自学网页</h3><p>每个小节先读一段引导，再按任务操作右侧图像。做过比较后，回答思考题，或直接查看解释。</p><p>折叠关可以播放、暂停、重播，也可以拖动进度，让整段数轴慢慢翻过去。</p><p>读完后点击“读完了，下一步”。各关5题允许留空提交，答案和草稿保存在当前浏览器。最后完成8题出门条。</p><div class="btnrow"><button class="primary" data-gaction="closehelp">开始学习</button></div></div>';document.body.append(d);d.querySelector('button').focus();break;}case'closehelp':$('.dialogback')?.remove();break;}

document.addEventListener('input',e=>{if(e.target.dataset.grange){e.stopImmediatePropagation();setG(e.target.dataset.grange,Number(e.target.value));}},true);
let gDrag=null;document.addEventListener('pointerdown',e=>{const p=e.target.closest('[data-gdrag]');if(!p)return;e.preventDefault();stopPlay();const svg=p.closest('svg');gDrag={rect:svg.getBoundingClientRect(),min:Number(svg.dataset.gmin),max:Number(svg.dataset.gmax),left:Number(svg.dataset.gleft),right:Number(svg.dataset.gright),width:Number(svg.dataset.gwidth)};});
document.addEventListener('pointermove',e=>{if(!gDrag)return;e.preventDefault();const x=(e.clientX-gDrag.rect.left)/gDrag.rect.width*gDrag.width,v=gDrag.min+(x-gDrag.left)/(gDrag.right-gDrag.left)*(gDrag.max-gDrag.min),s=currentStep(),z=gState();if(s.mode==='average')setG('x',Math.round((v-z.a)*2)/2);else if(s.mode.startsWith('mid'))setG('x',Math.round(v*2)/2);else setG('t',Math.round((v-s.a)/(z.d??s.d)/s.v));},{passive:false});document.addEventListener('pointerup',()=>gDrag=null);document.addEventListener('pointercancel',()=>gDrag=null);
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('.dialogback')?.remove();if(!e.target.closest('[data-gdrag]')||!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const s=currentStep(),z=gState(),key=['move','speed'].includes(s.mode)||isMotion(s)?'t':'x';setG(key,z[key]+(e.key==='ArrowRight'?.5:-.5));$('[data-gdrag]')?.focus();});

function isMotion(s){return s.mode.startsWith('motion');}
function motionSpec(s,z){return {...s,d:z.d??s.d};}
function expression(a,v,d=1){return `${n(a)} ${d>0?'+':'−'} ${v===1?'':n(v)}t`;}
function positionAt(s,t){return s.a+s.d*s.v*t;}
function qAt(s,t){return s.b+s.e*s.w*t;}
function motionSVG(s,t,draggable=true){
 const pair=s.mode==='motionPair',p=positionAt(s,t),q=pair?qAt(s,t):0;
 const vals=[s.a,positionAt(s,s.max),...(pair?[s.b,qAt(s,s.max)]:[])];
 const min=Math.min(...vals)-2,max=Math.max(...vals)+2,W=window.innerWidth<700?480:600,Y=178,X=x=>35+(x-min)/(max-min)*(W-70);
 let ticks='';for(let x=Math.ceil(min);x<=max;x++){ticks+=`<line x1="${X(x)}" x2="${X(x)}" y1="${Y}" y2="${Y+7}" stroke="#7d8e7c"/>${x%2===0?`<text x="${X(x)}" y="${Y+31}" text-anchor="middle" fill="#66766a" font-size="20">${n(x)}</text>`:''}`;}
 const trail=(from,to,y,color)=>`<line x1="${X(from)}" x2="${X(to)}" y1="${y}" y2="${y}" stroke="${color}" stroke-width="5" opacity=".5"/>${Math.abs(from-to)>0.01?`<path d="M${X(to)} ${y}l${to>from?-10:10} -6v12z" fill="${color}"/>`:''}`;
 let body=`<svg class="motion-diagram" viewBox="0 0 ${W} 305" role="img" aria-label="${pair?'两个动点在同一时刻的位置':'动点位置'}" data-time="${t}" data-p="${p}" ${pair?`data-q="${q}"`:''} data-gmin="${min}" data-gmax="${max}" data-gwidth="${W}" data-gleft="35" data-gright="${W-35}"><line x1="22" x2="${W-20}" y1="${Y}" y2="${Y}" stroke="#66766a" stroke-width="2"/><path d="M${W-18} ${Y}l-10 -6v12z" fill="#66766a"/>${ticks}`;
 if(pair){body+=`<text x="35" y="28" fill="#1666b2" font-size="21">P 向右 ${s.v} 格/秒</text><text x="${W-35}" y="59" text-anchor="end" fill="#8150af" font-size="21">Q 向${s.e>0?'右':'左'} ${s.w} 格/秒</text>`+trail(s.a,p,90,'#1666b2')+trail(s.b,q,115,'#8150af')+`<circle cx="${X(s.a)}" cy="${Y}" r="4" fill="#1666b2" opacity=".4"/><circle cx="${X(s.b)}" cy="${Y}" r="4" fill="#8150af" opacity=".4"/>`+point(X,p,Y,'P = '+n(p),'#1666b2')+point(X,q,Y,'Q = '+n(q),'#8150af',false,true);
 if(Math.abs(p-q)<1e-7)body+=`<circle cx="${X(p)}" cy="${Y}" r="16" fill="none" stroke="#246c50" stroke-width="3"/><text x="${W/2}" y="292" text-anchor="middle" fill="#246c50" font-size="22">${s.kind==='chase'?'恰好追上':'恰好相遇'}：两点都在 ${n(p)}</text>`;
 else body+=`<text x="${W/2}" y="292" text-anchor="middle" fill="#526448" font-size="22">t = ${n(t)} 秒，间距 ${n(Math.abs(q-p))} 格</text>`;
 }else{body+=bracket(X,s.a,p,80,`向${s.d>0?'右':'左'} ${n(s.v*t)} 格`,'#bb521a')+point(X,s.a,Y,'起点 '+n(s.a),'#1666b2',false,true)+point(X,p,Y,'P = '+n(p),'#bb521a',draggable);}
 return body+'</svg>';
}
function motionValues(s,t){const pair=s.mode==='motionPair',p=positionAt(s,t),q=pair?qAt(s,t):0;
 const vs=pair?[['经过时间',n(t)+' 秒'],['P 的位置',n(p)],['Q 的位置',n(q)]]:[['起点',n(s.a)],['路程',n(s.v*t)+' 格'],['P 的位置',n(p)]];
 return `<div class="values">${vs.map((v,j)=>`<div class="value" style="color:${pair?['#66766a','#1666b2','#8150af'][j]:['#1666b2','#66766a','#bb521a'][j]};background:${pair?['#f1f4ee','#edf4fc','#f5eef9'][j]:['#edf4fc','#f1f4ee','#fff3e9'][j]}"><span>${v[0]}</span><b>${v[1]}</b></div>`).join('')}</div><div class="motion-formulas">${pair?`<div class="p"><b>P 的位置：${expression(s.a,s.v)}</b>代入：${n(s.a)} + ${s.v} × ${n(t)} = ${n(p)}</div><div class="q"><b>Q 的位置：${expression(s.b,s.w,s.e)}</b>代入：${n(s.b)} ${s.e>0?'+':'−'} ${s.w} × ${n(t)} = ${n(q)}</div><div class="motion-eq">${Math.abs(p-q)<1e-7?'✓ 两个位置相等，可以核对所求时间。':`两点间距：${n(q)} − (${n(p)}) = ${n(q-p)} 格`}<br>列方程：<strong>${expression(s.a,s.v)} = ${expression(s.b,s.w,s.e)}</strong></div>`:`${s.mode==='motionT'?`<b class="p">位置表达式：${expression(s.a,s.v,s.d)}（t ≥ 0）</b><span>当 t = ${n(t)} 秒时：</span>`:''}${s.mode!=='motionDir'?`<span>路程：${s.v} × ${n(t)} = ${n(s.v*t)} 格</span>`:''}<span>位置：${n(s.a)} ${s.d>0?'+':'−'} ${s.mode==='motionDir'?n(s.v*t):`${s.v} × ${n(t)}`} = <strong>${n(p)}</strong></span>`}</div>`;
}
function motionInsight(s,t){const p=positionAt(s,t);if(s.mode==='motionPair'){const q=qAt(s,t);return `t = ${n(t)} 秒：P 在 ${n(p)}，Q 在 ${n(q)}；${Math.abs(p-q)<1e-7?(s.kind==='chase'?'追上了':'相遇了'):`相隔 ${n(Math.abs(q-p))} 格`}。`;}return `向${s.d>0?'右':'左'}走 ${n(s.v*t)} 格，P 在 ${n(p)}。${s.mode==='motionT'?`把 t = ${n(t)} 代入 ${expression(s.a,s.v,s.d)}。`:''}`;}
function motionControls(s,z){return `${s.mode!=='motionPair'?`<div class="presetrow direction-row"><button data-motion-dir="1" class="${(z.d??s.d)===1?'active':''}">向右 →</button><button data-motion-dir="-1" class="${(z.d??s.d)===-1?'active':''}">向左 ←</button></div>`:''}${rangeControl(s.mode==='motionDir'?'已走路程（格）':'经过时间 t（秒）','t',z.t,0,s.max,.5)}<div class="animationbar"><button class="primary" data-gaction="play">播放移动</button><button data-gaction="pause">暂停</button><button data-gaction="replay">重播</button><button data-gaction="reset">回到起点</button></div><div class="presetrow">${s.targets.map(t=>`<button data-gvalue="${t}">${t} ${s.mode==='motionDir'?'格':'秒'}</button>`).join('')}</div>`;}
document.addEventListener('click',e=>{const el=e.target.closest('[data-motion-dir]');if(!el)return;stopPlay();const z=gState();z.d=Number(el.dataset.motionDir);z.t=0;render(false);});
function isMotionQ(q){return ['expr','equation','meet','chase'].includes(q.type);}
function answerText(q){return q.optionLabels?q.optionLabels[q.options.indexOf(q.answer)]:n(q.answer)+(q.type==='meet'||q.type==='chase'?' 秒':'');}
function motionQuestion(q){
 if(q.type==='expr'){q.answer=0;q.title=`P 从 ${n(q.a)} 出发，向${q.d>0?'右':'左'}每秒走 ${q.v} 格。t 秒后，P 的位置表达式是？`;q.optionLabels=[expression(q.a,q.v,q.d),expression(q.a,q.v,-q.d),`${q.v}t`];q.options=[0,1,2];}
 else{const chase=q.type==='chase'||q.kind==='chase';q.kind=chase?'chase':'meet';q.d=1;q.e=chase?1:-1;const when=(q.b-q.a)/(q.v-q.e*q.w);q.eventTime=when;const context=`P 从 ${n(q.a)} 出发向右每秒走 ${q.v} 格，Q 从 ${n(q.b)} 出发向${chase?'右':'左'}每秒走 ${q.w} 格。两点同时出发、匀速移动。`;
 if(q.type==='equation'){q.answer=0;q.options=[0,1,2];q.optionLabels=[`${expression(q.a,q.v)} = ${expression(q.b,q.w,q.e)}`,`${q.v}t = ${q.w}t`,`${expression(q.a,q.v)} = ${expression(q.b,q.w,-q.e)}`];q.title=context+`设 t 秒后${chase?'追上':'相遇'}，应列哪个方程？`;}
 else{q.answer=when;q.title=context+`请先在纸上列方程并解答：几秒后${chase?'P 追上 Q':'两点相遇'}？（填时间，单位：秒）`;}}
 if(q.optionLabels){const shift=Math.abs(Math.round(q.a))%3;q.options=q.options.slice(shift).concat(q.options.slice(0,shift));q.optionLabels=q.options.map(k=>q.optionLabels[k]);}
 return q;
}
function reviewSpec(q){if(q.type==='expr')return {mode:'motionT',a:q.a,d:q.d,v:q.v,max:4};return {mode:'motionPair',kind:q.kind,a:q.a,b:q.b,v:q.v,w:q.w,d:1,e:q.e,max:q.eventTime};}
function motionExplanation(q){const s=reviewSpec(q);let lines;
 if(q.type==='expr'){lines=[`起点是 ${n(q.a)}，方向向${q.d>0?'右':'左'}。速度 ${q.v} 格/秒乘以 t 秒，路程为 ${q.v}t 格。`,`根据方向${q.d>0?'加上':'减去'}路程，位置表达式为 ${expression(q.a,q.v,q.d)}。`,`检验 t = 0，位置是 ${n(q.a)}，还在起点；t = 3 时，位置是 ${n(positionAt(s,3))}。只有 ${q.v}t 表示的是路程，不能漏掉起点。`];}
 else{const speed=q.v-q.e*q.w,gap=q.b-q.a,when=q.eventTime,where=positionAt(s,when);lines=[`设 t 秒后${q.kind==='chase'?'追上':'相遇'}。两点同时出发，移动时间都为 t。`,`分别写位置：P 表示 ${expression(q.a,q.v)}，Q 表示 ${expression(q.b,q.w,q.e)}。两点重合时位置相等，所以 ${expression(q.a,q.v)} = ${expression(q.b,q.w,q.e)}。`,`两边同时${q.e>0?'减':'加'} ${q.w}t，再${q.a<0?'加 '+n(-q.a):'减 '+n(q.a)}，整理得 ${q.v}t ${q.e>0?'−':'+'} ${q.w}t = ${n(q.b)} − (${n(q.a)})。`,`合并同类项：${speed}t = ${gap}，解得 t = ${n(when)}。`,`代回：P 的位置为 ${n(q.a)} + ${q.v} × ${n(when)} = ${n(where)}；Q 的位置为 ${n(q.b)} ${q.e>0?'+':'−'} ${q.w} × ${n(when)} = ${n(where)}。所以 ${n(when)} 秒后在表示 ${n(where)} 的点${q.kind==='chase'?'追上':'相遇'}。`];}
 return{lines,points:[],opts:{}};
}
function motionReview(q,id){const s=reviewSpec(q),end=q.type==='expr'?3:q.eventTime;return `<div class="drawing"><div id="graph-${id}" style="padding:10px">${motionSVG(s,end,false)}${motionValues(s,end)}</div><div style="padding:0 16px 14px"><label>验证任务：把时间依次调到0、${n(end/2)}、${n(end)}秒，${q.type==='expr'?'代入位置表达式，比较 P 的位置。':'比较 P、Q 的位置；只有位置相等时才相遇或追上。'}<input class="review-slider" type="range" min="0" max="${s.max}" step="0.25" value="${end}" data-review="${id}" aria-label="第${Number(id.split('-').pop())+1}题验证时间"></label><div id="feedback-${id}" class="small">${motionInsight(s,end)}</div></div></div>`;}
// Keep original movement rounds, drafts and exit ticket; start an updated round.
if(S.motionRevision!==3){
 const l=S.lessons[2],g=l.guided;

 l.guided={step:0,read:[!!(g.read[0]&&g.read[1]),!!(g.read[2]&&g.read[3]),false,false,false],revealed:{},choices:{},labs:{},logs:{}};

 if(l.runs.length){l.runs.forEach(r=>r.courseVersion=r.courseVersion||'旧版单点移动');l.runs.push({qs:questions(2,0),draft:{},snapshot:null,submittedAt:null,courseVersion:'位置表达式与方程'});l.current=l.runs.length-1;}
 if(S.exit){S.exitArchive=S.exitArchive||[];S.exitArchive.push(S.exit);S.exit=null;}
 S.confirmed=false;S.motionRevision=3;
}

const exportBeforeMotion=exportRecord;
exportRecord=function(){if(!S.exitArchive?.length){exportBeforeMotion();return;}const lines=['数轴破局者 · 学习记录（含历史出门条）','导出时间：'+new Date().toLocaleString('zh-CN'),'本次学习：'+(completed()?'已完成':'进行中')];const add=(r,label)=>{lines.push('\n'+label,r.snapshot?JSON.stringify(score(r)):'未提交');r.qs.forEach((q,j)=>lines.push(`${j+1}. ${q.title}\n草稿：${r.draft[j]??'空白'}；提交：${r.snapshot?.[j]??'未提交'}；答案：${answerText(q)}`));};S.lessons.forEach((l,i)=>l.runs.forEach((r,j)=>add(r,titles[i]+' · 第'+(j+1)+'轮')));S.exitArchive.forEach((r,j)=>add(r,'历史出门条 '+(j+1)));if(S.exit)add(S.exit,'当前出门条');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}));a.download='数轴破局者_学习记录.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
